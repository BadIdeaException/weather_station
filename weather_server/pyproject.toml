[tool.poetry]
name = "weather_server"
version = "0.1.0"
description = ""
authors = [
    "BadIdeaException"
]
license = "MIT"
readme = "README.md"
packages = [
    { include = "sensors", from = "src" },
    { include = "core", from = "src" }
]


[tool.poetry.dependencies]
python = ">=3.11.0"
lgpio = "^0.2.2.0"
crccheck = "^1.3.1"
fastapi = "^0.136.3"
uvicorn = "^0.49.0"

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-clarity = "^1.0.1"
pytest-spec = "^6.0.0"
httpx2 = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pylint = ">=4.0.4,<5.0.0"
black = ">=25.12.0,<26.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--spec --tb=short"
